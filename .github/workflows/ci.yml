name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # file-type@22 y pdfjs-dist@6 (dependencias reales del proyecto, usadas
  # por lib/ai/extract.ts) requieren Node >=22 — Node 20 las instala igual
  # bajo legacy-peer-deps pero rompe silenciosamente la resolución de tipos
  # de TypeScript aguas abajo. "22" (no un patch exacto) resuelve siempre al
  # último release de la línea 22.x LTS disponible en el runner.
  NODE_VERSION: "22"

jobs:
  # Build + lint + typecheck + Vitest: no dependen de Mongo/Mailpit reales,
  # corren siempre y son el gate más rápido antes de invertir tiempo en E2E.
  build-and-unit-tests:
    name: Build, lint, typecheck y Vitest
    runs-on: ubuntu-latest
    env:
      # Variables mínimas requeridas por lib/env.ts (ver Zod schema) — tanto
      # Vitest (importa lib/db.ts/lib/logger.ts indirectamente) como el build
      # de Next.js las necesitan para que getEnv() no falle. Valores de
      # prueba, sin relación con las credenciales reales de producción (esas
      # viven solo en Vercel).
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: economy-and-fair-competition-ci
      CONTACT_NOTIFICATION_EMAIL: contacto@economyandfaircompetition.com
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      ADMIN_ALLOWED_EMAILS: admin@economyandfaircompetition.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias
        run: npm ci

      - name: Diagnóstico temporal — inspeccionar node_modules instalado
        run: |
          echo "node -v: $(node -v)"
          echo "npm -v: $(npm -v)"
          echo "npm config list:"
          npm config list
          echo "--- .npmrc en el repo ---"
          cat .npmrc || echo "(no existe)"
          echo "--- conteo node_modules top-level ---"
          find node_modules -maxdepth 1 -type d | wc -l
          echo "--- @types/react ---"
          ls -la node_modules/@types/react/ 2>&1 || echo "NO EXISTE @types/react"
          echo "--- react ---"
          ls -la node_modules/react/ 2>&1 || echo "NO EXISTE react"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm run test

      - name: Build (Next.js)
        run: npm run build

      - name: Subir reporte de Vitest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: tests/reports/vitest
          retention-days: 14

  # E2E (Playwright): necesita una base de datos y un servidor de correo
  # reales para ejercitar el flujo completo (login por magic link, crear
  # posts/plantillas, editar contenido en vivo). Mongo y Mailpit corren como
  # contenedores efímeros del propio job — se destruyen al terminar, nunca
  # tocan el Atlas ni el Mailpit reales del entorno de desarrollo.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_UI_AUTH: admin:magiclink123
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: economy-and-fair-competition-ci
      MAILPIT_HOST: localhost
      MAILPIT_PORT: 1025
      MAILPIT_UI_URL: http://localhost:8025
      CONTACT_NOTIFICATION_EMAIL: contacto@economyandfaircompetition.com
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      ADMIN_ALLOWED_EMAILS: admin@economyandfaircompetition.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Sembrar base de datos (schema + imágenes + contenido real + posts)
        run: npm run seed:all

      - name: Playwright E2E
        run: npm run test:e2e

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/reports/playwright
          retention-days: 14

  # Semgrep: SAST, no depende de servicios externos — corre en paralelo a
  # build-and-unit-tests. No falla el pipeline por hallazgos (Semgrep en modo
  # "auto" puede producir falsos positivos); el reporte queda disponible como
  # artefacto para revisión humana, igual que en el flujo local documentado
  # en QUICK-START.md.
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Semgrep scan
        # Corre en un job normal (con Node ya disponible para el paso
        # siguiente) en vez de container: image: semgrep/semgrep — esa imagen
        # no trae Node preinstalado y actions/setup-node no puede instalarlo
        # dentro de un contenedor de job. La propia imagen oficial de Semgrep
        # se usa aquí solo para ejecutar el binario vía `docker run`.
        run: |
          mkdir -p tests/reports/semgrep
          docker run --rm -v "$PWD:/src" semgrep/semgrep \
            semgrep scan --config auto --json --output /src/tests/reports/semgrep/report.json /src
        continue-on-error: true

      - name: Generar reporte HTML
        run: node scripts/semgrep-html-report.mjs

      - name: Subir reporte de Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: tests/reports/semgrep
          retention-days: 14
