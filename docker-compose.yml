# =====================================================================
# docker-compose.yml — Referencia completa de infraestructura
# =====================================================================
# Estado real del MVP (ver AGENTS.md §1):
#   - MongoDB: Atlas (nube), NO se usa el servicio "mongo" de aquí.
#   - Correo dev: Mailpit YA CORRE como contenedor compartido del entorno
#     (magic-link-mailpit, puertos 1025/8025) — no se levanta otro aquí
#     por defecto. El servicio "mailpit" queda definido para el caso en
#     que se quiera una instancia dedicada a este proyecto.
#   - Almacenamiento: disco local (./public/uploads), NO RustFS.
#   - Vault, Traefik, SonarQube, Elasticsearch+Kibana: NO activos en el
#     MVP. Se documentan aquí para poder activarse en el futuro sin
#     tener que redescubrir la configuración (garantía agnóstica de
#     toscaprompt).
#
# Para levantar solo lo que este proyecto usa activamente hoy, no hay
# nada que levantar vía Docker (Mongo es Atlas, Mailpit ya está arriba
# compartido, uploads es disco local). Este archivo es 100% opcional.
# =====================================================================

services:
  # -------------------------------------------------------------------
  # MongoDB local — alternativa a Atlas si se decide dejar de usar la nube.
  # NO ACTIVO por defecto en este proyecto (usamos Atlas).
  # -------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: economy-fair-competition-mongo
    restart: unless-stopped
    ports:
      - "27020:27017"
    volumes:
      - efc_mongo_data:/data/db
    profiles: ["mongo-local"]

  # -------------------------------------------------------------------
  # Mailpit dedicado — alternativa si se deja de reusar magic-link-mailpit.
  # NO ACTIVO por defecto (reusamos el contenedor compartido del entorno).
  # -------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: economy-fair-competition-mailpit
    restart: unless-stopped
    ports:
      - "1026:1025" # SMTP (puerto distinto al compartido 1025)
      - "8026:8025" # UI web (puerto distinto al compartido 8025)
    profiles: ["mailpit-dedicated"]

  # -------------------------------------------------------------------
  # RustFS (S3-compatible) — si se decide migrar de disco local a S3.
  # NO ACTIVO en el MVP.
  # -------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: economy-fair-competition-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_USERNAME: ${AWS_USERNAME:-rustfsadmin}
      RUSTFS_PASSWORD: ${AWS_PASSWORD:-rustfsadmin}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - efc_rustfs_data:/data
    profiles: ["storage-s3"]

  # -------------------------------------------------------------------
  # HashiCorp Vault — gestión de secretos con fallback a .env.
  # NO ACTIVO en el MVP (documentado por regla de gobernanza toscaprompt).
  # -------------------------------------------------------------------
  vault:
    image: hashicorp/vault:latest
    container_name: economy-fair-competition-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8201:8200"
    profiles: ["vault"]

  # -------------------------------------------------------------------
  # Traefik — reverse proxy + SSL automatizado (Let's Encrypt).
  # NO ACTIVO en el MVP. Ver CERTIFICADOS.md para la guía completa.
  # -------------------------------------------------------------------
  traefik:
    image: traefik:v3.2
    container_name: economy-fair-competition-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-admin@economyandfaircompetition.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--api.dashboard=true"
    ports:
      - "80:80"
      - "443:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - efc_traefik_acme:/letsencrypt
    profiles: ["traefik"]

  # -------------------------------------------------------------------
  # SonarQube — análisis estático de calidad (complementario a Semgrep).
  # NO ACTIVO en el MVP.
  # -------------------------------------------------------------------
  sonarqube:
    image: sonarqube:community
    container_name: economy-fair-competition-sonarqube
    restart: unless-stopped
    ports:
      - "9001:9000"
    volumes:
      - efc_sonarqube_data:/opt/sonarqube/data
      - efc_sonarqube_extensions:/opt/sonarqube/extensions
    profiles: ["sonarqube"]

  # -------------------------------------------------------------------
  # Elasticsearch + Kibana — observabilidad centralizada.
  # NO ACTIVO en el MVP (se usa Pino JSON + archivo local, ver OBSERVABILIDAD.md).
  # -------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: economy-fair-competition-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
    volumes:
      - efc_es_data:/usr/share/elasticsearch/data
    profiles: ["observability"]

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    container_name: economy-fair-competition-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5602:5601"
    depends_on:
      - elasticsearch
    profiles: ["observability"]

volumes:
  efc_mongo_data:
  efc_rustfs_data:
  efc_traefik_acme:
  efc_sonarqube_data:
  efc_sonarqube_extensions:
  efc_es_data:
